# MCP targets for Codex as the orchestrator. Copy the relevant tables into the
# active CODEX_HOME/config.toml and replace /absolute/path/to/claude-delegator.
# The codex table is the same uniform bridge as every other entry: it runs
# `codex exec --json`, pins sandbox_mode and approval_policy per call so a child
# approval prompt cannot suspend its parent, and clamps effort per model. It no
# longer needs `-c mcp_servers.codex.enabled=false`: a nested Codex inherits
# CLAUDE_DELEGATOR_CODEX_DEPTH and its own codex bridge refuses to delegate.
#
# Every table approves its own tools. Under approval_policy = "never", Codex
# refuses any MCP tool that is not approved ("MCP tool call requires approval,
# but approval policy is never"), and the codex bridge pins exactly that
# policy on every Codex it starts. Approval lets Codex start other agents
# unattended, which is what this delegator is for. A running
# `codex app-server` daemon keeps the configuration it started with, so run
# `codex app-server daemon restart` after editing this file.

[mcp_servers.claude]
command = "node"
args = ["/absolute/path/to/claude-delegator/server/claude/index.js"]
enabled_tools = ["claude", "claude-reply"]
startup_timeout_sec = 45
tool_timeout_sec = 3600
required = false
default_tools_approval_mode = "approve"

[mcp_servers.codex]
command = "node"
args = ["/absolute/path/to/claude-delegator/server/codex/index.js"]
enabled_tools = ["codex", "codex-reply"]
