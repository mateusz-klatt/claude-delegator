sonar.projectKey=mateusz-klatt_claude-delegator
sonar.organization=mateusz-klatt
sonar.host.url=https://sonarcloud.io

sonar.sources=server
sonar.tests=test,server
sonar.test.inclusions=test/**/*.test.js,server/**/*.test.js
sonar.exclusions=server/**/*.test.js
sonar.sourceEncoding=UTF-8

# The inclusion patterns keep colocated tests disjoint from production sources.
# Coverage is generated by c8 in CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
